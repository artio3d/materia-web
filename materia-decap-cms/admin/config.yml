# ============================================================
#  MATERIA — Decap CMS Configuration
#  Όλα τα labels/hints στα Ελληνικά για τη διαχειρίστρια.
# ============================================================

backend:
  name: git-gateway
  branch: main # Αλλάξτε σε "master" αν το repo σας χρησιμοποιεί master

# Ελληνικά μενού & κουμπιά στο περιβάλλον διαχείρισης
locale: "gr"

# Πού αποθηκεύονται οι εικόνες που ανεβάζει η διαχειρίστρια
media_folder: "images/uploads"
public_folder: "/images/uploads"

# Προαιρετικό: ροή "Πρόχειρο → Έλεγχος → Δημοσίευση".
# Αφαιρέστε τη γραμμή αν προτιμάτε άμεση δημοσίευση με το "Publish".
publish_mode: editorial_workflow

site_url: "https://materia.gr"
display_url: "https://materia.gr"

collections:
  - name: "site_content"
    label: "Περιεχόμενο Ιστοσελίδας"
    files:

      # ══════════════════════════════════════════════════════
      # ΠΡΟΪΟΝΤΑ
      # ══════════════════════════════════════════════════════
      - name: "products"
        label: "🛒 Προϊόντα"
        file: "content/products.json"
        description: "Ο πλήρης κατάλογος προϊόντων. Δομή: Κατηγορία → Υποκατηγορία → Προϊόντα."
        fields:
          - name: "categories"
            label: "Κατηγορίες Προϊόντων"
            label_singular: "Κατηγορία"
            widget: "list"
            summary: "{{fields.name}}"
            hint: "Πατήστε «Προσθήκη Κατηγορία» για νέα κατηγορία. Σύρετε για αλλαγή σειράς."
            fields:
              - name: "name"
                label: "Όνομα Κατηγορίας"
                widget: "string"
                hint: "π.χ. ΜΟΝΩΤΙΚΑ, ΔΑΠΕΔΑ. Γράψτε το με κεφαλαία."
              - name: "icon"
                label: "Εικονίδιο (emoji)"
                widget: "string"
                default: "◈"
                required: false
                hint: "Ένα σύμβολο/emoji που εμφανίζεται δίπλα στην κατηγορία, π.χ. 🛡 ή 🧱. Μπορείτε να το αντιγράψετε από το emojipedia.org."
              - name: "subcategories"
                label: "Υποκατηγορίες"
                label_singular: "Υποκατηγορία"
                widget: "list"
                summary: "{{fields.name}}"
                hint: "Κάθε κατηγορία περιέχει μία ή περισσότερες υποκατηγορίες με τα προϊόντα τους."
                fields:
                  - name: "name"
                    label: "Όνομα Υποκατηγορίας"
                    widget: "string"
                    hint: "π.χ. ΘΕΡΜΟΜΟΝΩΣΗ, ΣΤΕΓΑΝΟΠΟΙΗΣΗ."
                  - name: "products"
                    label: "Προϊόντα"
                    label_singular: "Προϊόν"
                    widget: "list"
                    summary: "{{fields.name}}"
                    hint: "Πατήστε «Προσθήκη Προϊόν» για να προσθέσετε νέο προϊόν στην υποκατηγορία."
                    fields:
                      - name: "name"
                        label: "Όνομα Προϊόντος"
                        widget: "string"
                        hint: "π.χ. Εξωτερική Θερμοπρόσοψη (ETICS)."
                      - name: "range"
                        label: "Γκάμα / Μάρκες"
                        widget: "string"
                        required: false
                        hint: "Οι μάρκες που καλύπτουν το προϊόν, χωρισμένες με «/», π.χ. Fibran / BASF / Knauf."
                      - name: "tag"
                        label: "Ετικέτα / Πιστοποιήσεις"
                        widget: "string"
                        required: false
                        hint: "Σύντομο τεχνικό κείμενο, π.χ. ETICS · ETAG 004 · CE."
                      - name: "desc"
                        label: "Περιγραφή"
                        widget: "text"
                        required: false
                        hint: "2–4 προτάσεις που περιγράφουν το προϊόν και τις εφαρμογές του."
                      - name: "highlights"
                        label: "Βασικά Πλεονεκτήματα"
                        label_singular: "Πλεονέκτημα"
                        widget: "list"
                        required: false
                        field:
                          name: "highlight"
                          label: "Πλεονέκτημα"
                          widget: "string"
                        hint: "Σύντομες φράσεις (3–5), π.χ. «Πιστοποίηση ETAG 004», «Μείωση κατανάλωσης έως 60%»."
                      - name: "materials"
                        label: "Γκάμα Υλικών / Σύστημα"
                        label_singular: "Υλικό"
                        widget: "list"
                        required: false
                        field:
                          name: "material"
                          label: "Υλικό"
                          widget: "string"
                        hint: "Η λίστα υλικών που εμφανίζεται στις λεπτομέρειες του προϊόντος."
                      - name: "color"
                        label: "Χρώμα Φόντου Προεπισκόπησης"
                        widget: "color"
                        default: "#0d1f3c"
                        required: false
                        allowInput: true
                        hint: "Το χρώμα πίσω από την προεπισκόπηση του προϊόντος. Προτιμήστε σκούρες αποχρώσεις."

      # ══════════════════════════════════════════════════════
      # ΜΑΡΚΕΣ / ΣΥΝΕΡΓΑΤΕΣ
      # ══════════════════════════════════════════════════════
      - name: "brands"
        label: "🤝 Συνεργάτες / Μάρκες"
        file: "content/brands.json"
        description: "Οι μάρκες που εμφανίζονται στην κινούμενη λωρίδα (ticker) της αρχικής σελίδας."
        fields:
          - name: "brands"
            label: "Λίστα Μαρκών"
            label_singular: "Μάρκα"
            widget: "list"
            field:
              name: "brand"
              label: "Όνομα Μάρκας"
              widget: "string"
            hint: "Γράψτε το όνομα κάθε μάρκας με κεφαλαία, π.χ. KNAUF, MAPEI. Σύρετε για αλλαγή σειράς."

      # ══════════════════════════════════════════════════════
      # BLOG / ΑΡΘΡΑ
      # ══════════════════════════════════════════════════════
      - name: "blog"
        label: "📰 Άρθρα (Blog)"
        file: "content/blog.json"
        description: "Τα άρθρα που εμφανίζονται στην ενότητα Blog. Το πρώτο άρθρο με «Προβεβλημένο» εμφανίζεται μεγάλο."
        fields:
          - name: "posts"
            label: "Άρθρα"
            label_singular: "Άρθρο"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - name: "title"
                label: "Τίτλος Άρθρου"
                widget: "string"
              - name: "tag"
                label: "Κατηγορία / Ετικέτα"
                widget: "string"
                hint: "π.χ. ΤΕΧΝΟΛΟΓΙΑ, ΑΡΧΙΤΕΚΤΟΝΙΚΗ, ΒΙΩΣΙΜΟΤΗΤΑ."
              - name: "date"
                label: "Ημερομηνία Δημοσίευσης"
                widget: "datetime"
                date_format: "DD/MM/YYYY"
                time_format: false
                format: "YYYY-MM-DD"
                picker_utc: true
              - name: "readTime"
                label: "Χρόνος Ανάγνωσης"
                widget: "string"
                required: false
                hint: "π.χ. «5 λεπτά» ή «8 λεπτά ανάγνωση»."
              - name: "featured"
                label: "Προβεβλημένο Άρθρο"
                widget: "boolean"
                default: false
                required: false
                hint: "Ενεργοποιήστε το ΜΟΝΟ σε ένα άρθρο — αυτό θα εμφανίζεται μεγάλο στην κορυφή."
              - name: "image"
                label: "Εικόνα Άρθρου (προαιρετική)"
                widget: "image"
                required: false
                hint: "Αν δεν ανεβάσετε εικόνα, η σελίδα θα εμφανίσει αυτόματα ένα κομψό γραφικό μοτίβο."
              - name: "body"
                label: "Κείμενο Άρθρου"
                widget: "markdown"
                required: false
                hint: "Το πλήρες κείμενο του άρθρου."

      # ══════════════════════════════════════════════════════
      # ΘΕΣΕΙΣ ΕΡΓΑΣΙΑΣ
      # ══════════════════════════════════════════════════════
      - name: "careers"
        label: "💼 Θέσεις Εργασίας"
        file: "content/careers.json"
        description: "Οι ανοιχτές θέσεις εργασίας. Απενεργοποιήστε το «Ενεργή» για να κρύψετε μια θέση χωρίς να τη διαγράψετε."
        fields:
          - name: "intro"
            label: "Εισαγωγικό Κείμενο Ενότητας"
            widget: "text"
            required: false
            hint: "Το κείμενο που εμφανίζεται πάνω από τη λίστα θέσεων."
          - name: "jobs"
            label: "Θέσεις"
            label_singular: "Θέση Εργασίας"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - name: "title"
                label: "Τίτλος Θέσης"
                widget: "string"
                hint: "π.χ. ΣΥΜΒΟΥΛΟΣ ΠΩΛΗΣΕΩΝ (B2B). Γράψτε τον με κεφαλαία."
              - name: "location"
                label: "Τοποθεσία"
                widget: "string"
                default: "Θεσσαλονίκη"
              - name: "type"
                label: "Τύπος Απασχόλησης"
                widget: "select"
                options: ["Πλήρης Απασχόληση", "Μερική Απασχόληση", "Σύμβαση Έργου", "Πρακτική Άσκηση"]
                default: "Πλήρης Απασχόληση"
              - name: "experience"
                label: "Επίπεδο Εμπειρίας"
                widget: "string"
                required: false
                hint: "π.χ. Junior, Mid-level, Senior, Έμπειρος."
              - name: "active"
                label: "Ενεργή Θέση"
                widget: "boolean"
                default: true
                hint: "Απενεργοποιήστε το όταν καλυφθεί η θέση — θα εξαφανιστεί από τη σελίδα."

      # ══════════════════════════════════════════════════════
      # ΚΑΤΑΣΤΗΜΑΤΑ & ΕΠΙΚΟΙΝΩΝΙΑ
      # ══════════════════════════════════════════════════════
      - name: "locations"
        label: "📍 Καταστήματα & Επικοινωνία"
        file: "content/locations.json"
        description: "Τα σημεία εξυπηρέτησης (showroom, αποθήκες) και τα στοιχεία επικοινωνίας."
        fields:
          - name: "email"
            label: "Email Επικοινωνίας"
            widget: "string"
            hint: "Το κεντρικό email που εμφανίζεται στην ενότητα Επικοινωνία."
          - name: "locations"
            label: "Σημεία Εξυπηρέτησης"
            label_singular: "Σημείο"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - name: "name"
                label: "Ονομασία"
                widget: "string"
                hint: "π.χ. ΕΔΡΑ & SHOWROOM — ΘΕΡΜΗ."
              - name: "address"
                label: "Διεύθυνση"
                widget: "text"
                hint: "Μπορείτε να πατήσετε Enter για δεύτερη γραμμή (οδός / περιοχή / Τ.Κ.)."
              - name: "phone"
                label: "Τηλέφωνο"
                widget: "string"
                required: false
              - name: "hours"
                label: "Ωράριο Λειτουργίας"
                widget: "string"
                required: false
                hint: "π.χ. Δε–Πα: 08:30–16:30 • Σα: 10:00–14:00."
